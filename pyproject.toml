[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xclinvision"
version = "0.1.0"
description = "Explainable Medical Imaging AI Platform with Clinical Decision Support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "XClinVision Team"}
]
keywords = ["medical-imaging", "deep-learning", "explainable-ai", "clinical-decision-support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "timm>=0.9.0",
    
    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "pydicom==3.0.1",         # processing.py — .dcm ingestion
    "albumentations>=1.3.0",
    
    # LLM & RAG
    "openai>=1.0.0",
    "langchain-text-splitters>=0.0.1",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "bm25s==0.3.8",           # agent/ingest_knowledge.py — BM25 half of the hybrid retriever
    "tiktoken==0.12.0",       # xclinvisionagent.py — cross-verify prompt budgeting
    
    # Backend & API
    "fastapi>=0.103.0",
    "jinja2==3.1.6",          # agent/reporter.py — clinical report templating
    "weasyprint==66.0",       # /api/v2/export-report format="pdf" (needs system pango/cairo)
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    
    # Frontend
    "streamlit>=1.26.0",
    "requests==2.32.5",       # app/frontend/api_client.py
    
    # MLOps & Experiment Tracking
    "mlflow>=2.7.0",
    
    # Configuration & Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    
    # Metrics & Analysis
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.16.0",
    
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
