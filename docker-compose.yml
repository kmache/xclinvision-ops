# Local development compose — runs backend + frontend without nginx
services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - XCLINVISION_MODELS_DIR=/app/models/best_models
      - XCLINVISION_DATA_DIR=/app/data/processed_384
      - XCLINVISION_CORS_ORIGINS=http://localhost:8501,http://frontend:8501
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-openai}
      - XCLINVISION_VECTORSTORE_DIR=/app/data/vector_db
      # Analyses DB + stored images must outlive the container: without a
      # volume these default to data/ in the writable layer and are lost.
      - XCLINVISION_DB_PATH=/app/data/store/xclinvision.db
      - XCLINVISION_IMAGE_DIR=/app/data/store/images
    volumes:
      - ./models/best_models:/app/models/best_models:ro
      - ./data/processed_384:/app/data/processed_384:ro
      - ./data/vector_db:/app/data/vector_db:ro
      - xclinvision-store:/app/data/store
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
      # Blank the LLM key: the frontend talks only to the backend.
      - OPENAI_API_KEY=
    depends_on:
      backend:
        condition: service_healthy

volumes:
  xclinvision-store:
