# BiomedCLIP — model-specific overrides (merged on top of system.yaml)
name: biomedclip
type: foundation_model

architecture:
  backbone: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  pretrained: true
  num_classes: 3  # auto-derived from system.yaml class_names at runtime
  dropout_rate: 0.2
  head:
    type: sequential
    layers:
      - type: layernorm
        normalized_shape: 512
      - type: dropout
        p: 0.2
      - type: linear
        in_features: 512  # BiomedCLIP vision feature dim
        out_features: 256
      - type: relu
      - type: dropout
        p: 0.2
      - type: linear
        in_features: 256
        out_features: 3  # must match num_classes

transfer_learning:
  freeze_vision_encoder: false
  freeze_text_encoder: true  # Only vision encoder used for classification
  differential_lr:
    enabled: true
    encoder_lr: 1.0e-5
    head_lr: 1.0e-4

# Override system defaults where this model differs
input:
  size: [224, 224]
  normalize:  # CLIP-specific normalization (differs from ImageNet)
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]

training:
  batch_size: 16
  optimizer:
    lr: 1.0e-5  # Lower LR for foundation models
    weight_decay: 0.1
  scheduler:
    min_lr: 1.0e-7

explainability:
  method: attention_map
  target_layer: vision_model.encoder.layers

comparison:
  category: Medical Foundation Model
  strengths:
    - Pre-trained on medical images (PubMed 24M)
    - High semantic alignment
    - Domain-specific knowledge
  weaknesses:
    - Heavy model
    - Requires careful fine-tuning
    - Higher memory requirements
  expected_performance:
    recall_pneumonia: 0.90
    ece: 0.09
