name: swin_t
type: transformer

architecture:
  backbone: swin_t
  pretrained: true
  # num_classes: NOT set here — derived at runtime from system.yaml model.class_names
  dropout_rate: 0.3
  # head: managed by timm — no custom head definition needed

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 5.0e-5
    head_lr: 5.0e-4

input:
  size: [224, 224]

explainability:
  method: gradcam++
  target_layer: layers.3
