# ResNet-50 — model-specific overrides (merged on top of system.yaml)
name: resnet50
type: cnn

architecture:
  backbone: resnet50
  pretrained: true
  num_classes: 3
  dropout_rate: 0.3
  head:
    type: sequential
    layers:
      - type: adaptive_avg_pool2d
        output_size: [1, 1]
      - type: flatten
      - type: linear
        in_features: 2048  # ResNet-50 feature dim
        out_features: 512
      - type: relu
      - type: dropout
        p: 0.3
      - type: linear
        in_features: 512
        out_features: 3

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4

# Override system defaults only where this model differs
input:
  size: [384, 384]

explainability:
  method: gradcam++
  target_layer: layer4

comparison:
  category: CNN (Legacy)
  strengths:
    - Stable training
    - Fast inference
    - Strong inductive bias for medical images
  weaknesses:
    - Moderate calibration
    - Blurry heatmaps
  expected_performance:
    recall_pneumonia: 0.88
    ece: 0.12
