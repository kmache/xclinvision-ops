name: resnet50
type: cnn

architecture:
  backbone: resnet50
  pretrained: true
  num_classes: 3
  dropout_rate: 0.3
  
  # Custom head configuration
  head:
    type: sequential
    layers:
      - type: adaptive_avg_pool2d
        output_size: [1, 1]
      - type: flatten
      - type: linear
        in_features: 2048
        out_features: 512
      - type: relu
      - type: dropout
        p: 0.3
      - type: linear
        in_features: 512
        out_features: 3

# Transfer learning strategy
transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4

input:
  size: [384, 384]
  channels: 3
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  batch_size: 32
  epochs: 100
  
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4
    
  scheduler:
    name: cosine_warmup
    warmup_epochs: 5
    min_lr: 1.0e-6

uncertainty:
  temperature_scaling: true
  mc_dropout:
    enabled: true
    num_samples: 10

explainability:
  method: gradcam++
  target_layer: layer4

comparison:
  category: CNN (Legacy)
  strengths:
    - Stable training
    - Fast inference
    - Strong inductive bias for medical images
  weaknesses:
    - Moderate calibration
    - Blurry heatmaps
  expected_performance:
    recall_pneumonia: 0.88
    ece: 0.12
