# XClinVision System Configuration
paths:
  raw_data_dir: "./data/raw"
  processed_data_dir: "./data/processed"
  quarantine_dir: "./data/quarantine"

# Augmentation
augmentation:
  horizontal_flip: true   # set false for laterality-sensitive classes (e.g. pneumothorax, effusion)

# Model Configuration
# class_names is the single source of truth for disease classes.
# To change the set of diseases, update class_names below and ensure your
# data directories / manifest match.  num_classes is derived automatically.
model:
  class_names: ['No finding', 'Cardiomegaly', 'Aortic enlargement', 'Pleural thickening',  'Pulmonary fibrosis']
  alpha: 1.2
  classification_mode: "multilabel" # "multilabel" or "multiclass"

clinical_rules:
  No finding:
    normal_class: true
  Cardiomegaly:
    expected_region_key: "cardiac"
  Aortic enlargement:
    expected_region_key: "cardiac"
  Pleural thickening:
    expected_regions: ["left_lower", "right_lower", "left_middle", "right_middle"]
  Pulmonary fibrosis:
    expected_regions: ["left_lower", "right_lower", "left_middle", "right_middle", "left_upper", "right_upper"]

training:
  label_smoothing: 0.1
  optimizer:
    weight_decay: 1.0e-4
  
  # Rate Limiting
  rate_limit:
    requests_per_minute: 60
    
  # File Upload
  upload:
    max_file_size: 10_485_760  # 10MB
    allowed_extensions: [".jpg", ".jpeg", ".png", ".dcm", ".dicom"]

# Dashboard Configuration
dashboard:
  title: "XClinVision - Clinical Decision Support"
  page_icon: "🩺"
  layout: "wide"
  
  # Theme
  theme:
    primary_color: "#1f77b4"
    background_color: "#ffffff"
    secondary_background: "#f0f2f6"
    text_color: "#262730"

# Database Configuration
database:
  url: "${DATABASE_URL:-postgresql://localhost:5432/xclinvision}"
  pool_size: 5
  max_overflow: 10
  
  # Tables
  tables:
    - predictions
    - feedback
    - audit_logs
    - model_versions

# MLOps Configuration
mlops:
  experiment_tracking: "mlflow"
  model_registry: "mlflow"
  dataset_versioning: "dvc"
  
  # Monitoring
  monitoring:
    enabled: true
    drift_detection: true
    performance_monitoring: true
    alert_threshold: 0.05
  
  # Retraining
  retraining:
    trigger:
      - drift_detected
      - feedback_count_threshold
    feedback_threshold: 100

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    - type: "console"
      level: "INFO"
    - type: "file"
      level: "DEBUG"
      filename: "logs/xclinvision.log"
      max_bytes: 10_485_760  # 10MB
      backup_count: 5
