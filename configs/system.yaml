# XClinVision System Configuration
# Only keys actually consumed by the codebase are kept here.
# Per-model settings (architecture, input size, explainability) live in
# configs/<model>.yaml and are deep-merged on top of this file at runtime.

# Paths (used by scripts/train.py)
paths:
  raw_data_dir: "./data/raw"
  processed_data_dir: "./data/processed"
  quarantine_dir: "./data/quarantine"

# Augmentation
augmentation:
  horizontal_flip: true   # set false for laterality-sensitive classes (e.g. pneumothorax, effusion)

# Model Configuration
# class_names is the single source of truth for disease classes.
# To change the set of diseases, update class_names below and ensure your
# data directories / manifest match.  num_classes is derived automatically.
model:
  class_names: ["Normal", "Pneumonia", "Cardiomegaly"]
  # Classification mode: "multiclass" (one label per image, softmax + CE) or
  # "multilabel" (multiple labels per image, sigmoid + BCE).  When using
  # multilabel, the manifest CSV must contain one binary column per class name.
  classification_mode: "multiclass"

# Clinical plausibility rules (optional, disease-agnostic).
# Each entry maps a class name (case-insensitive) to the expected XAI
# activation pattern so that clinical_plausibility_score() can evaluate
# whether the Grad-CAM focus is anatomically plausible.
#
# Supported rule types:
#   normal_class: true         – expect LOW overall activation
#   expected_regions: [list]   – expect HIGH activation in these LUNG_REGIONS keys
#   expected_region_key: "key" – expect HIGH activation in a single region key
#
# If a class has no rule, a generic activation-spread heuristic is used.
# To add a new disease, add an entry here — no code changes required.
clinical_rules:
  Normal:
    normal_class: true
  Pneumonia:
    expected_regions: ["left_upper", "left_middle", "left_lower",
                       "right_upper", "right_middle", "right_lower"]
  Cardiomegaly:
    expected_region_key: "cardiac"

# Training defaults (can be overridden by CLI flags)
training:
  label_smoothing: 0.1
  optimizer:
    weight_decay: 1.0e-4
  
  # Rate Limiting
  rate_limit:
    requests_per_minute: 60
    
  # File Upload
  upload:
    max_file_size: 10_485_760  # 10MB
    allowed_extensions: [".jpg", ".jpeg", ".png", ".dcm"]

# Dashboard Configuration
dashboard:
  title: "XClinVision - Clinical Decision Support"
  page_icon: "🩺"
  layout: "wide"
  
  # Theme
  theme:
    primary_color: "#1f77b4"
    background_color: "#ffffff"
    secondary_background: "#f0f2f6"
    text_color: "#262730"

# Database Configuration
# IMPORTANT: Set the DATABASE_URL environment variable instead of
# hardcoding credentials.  The placeholder below is for documentation only.
database:
  url: "${DATABASE_URL:-postgresql://localhost:5432/xclinvision}"
  pool_size: 5
  max_overflow: 10
  
  # Tables
  tables:
    - predictions
    - feedback
    - audit_logs
    - model_versions

# MLOps Configuration
mlops:
  experiment_tracking: "mlflow"
  model_registry: "mlflow"
  dataset_versioning: "dvc"
  
  # Monitoring
  monitoring:
    enabled: true
    drift_detection: true
    performance_monitoring: true
    alert_threshold: 0.05
  
  # Retraining
  retraining:
    trigger:
      - drift_detected
      - feedback_count_threshold
    feedback_threshold: 100

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    - type: "console"
      level: "INFO"
    - type: "file"
      level: "DEBUG"
      filename: "logs/xclinvision.log"
      max_bytes: 10_485_760  # 10MB
      backup_count: 5
