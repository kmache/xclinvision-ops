name: convnext_small
type: cnn

architecture:
  backbone: convnext_small
  pretrained: true
  dropout_rate: 0.3
  target_layer: stages.3

input:
  size: [384, 384]

training:
  loss: ce

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 5.0e-5
    head_lr: 5.0e-4

explainability:
  method: gradcam++
