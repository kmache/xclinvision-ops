name: convnext_small
type: cnn

architecture:
  backbone: convnext_small
  pretrained: true
  dropout_rate: 0.3
  target_layer: stages.3  # For XAI

input:
  size: [384, 384]

training:  # ← Add these
  batch_size: 32
  lr: 1e-4
  weight_decay: 1e-4
  label_smoothing: 0.15
  loss: focal

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 1e-5
    head_lr: 1e-4

explainability:
  method: gradcam++



