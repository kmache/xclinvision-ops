name: densenet
type: cnn

architecture:
  backbone: densenet
  pretrained: true
  # num_classes: NOT set here — derived at runtime from system.yaml model.class_names
  dropout_rate: 0.3
  head:
    type: sequential
    layers:
      - type: adaptive_avg_pool2d
        output_size: [1, 1]
      - type: flatten
      - type: linear
        in_features: 1024
        out_features: 512
      - type: relu
      - type: dropout
        p: 0.3
      - type: linear
        in_features: 512
        # out_features: NOT set here — determined at build time from system.yaml model.class_names

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4

input:
  size: [384, 384]

explainability:
  method: gradcam++
  target_layer: features.denseblock4
