name: densenet
type: cnn

architecture:
  backbone: densenet
  pretrained: true
  # num_classes: NOT set here — derived at runtime from system.yaml model.class_names
  dropout_rate: 0.3
  # head: managed by timm — no custom head definition needed

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 5.0e-5
    head_lr: 5.0e-4

input:
  size: [384, 384]

# Focal+GeM v2 — best empirical results (see convnext_small.yaml for rationale)
training:
  loss: focal
  pooling: gem
  process_size: 1024

explainability:
  method: gradcam++
  target_layer: features.denseblock4
