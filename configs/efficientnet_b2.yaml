name: efficientnet_b2
type: cnn

# class_names and num_classes are defined in system.yaml (single source of truth).
# Only uncomment the overrides below if this model needs different classes.
# model:
#   num_classes: 3
#   class_names: ["Normal", "Pneumonia", "Cardiomegaly"]

architecture:
  backbone: efficientnet_b2
  pretrained: true
  # num_classes: NOT set here — derived at runtime from system.yaml model.class_names
  dropout_rate: 0.3
  # head: managed by timm — no custom head definition needed

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 5.0e-5
    head_lr: 5.0e-4

input:
  size: [384, 384]

explainability:
  method: gradcam++
  target_layer: blocks.6
