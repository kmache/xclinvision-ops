name: efficientnet_b2
type: cnn

# Override model.num_classes here to train with a different number of classes.
# Update class_names to match. Examples:
#   2 classes: ["Normal", "Pneumonia"]
#   4 classes: ["Normal", "Pneumonia", "Cardiomegaly", "COVID-19"]
model:
  num_classes: 3
  class_names: ["Normal", "Pneumonia", "Cardiomegaly"]

architecture:
  backbone: efficientnet_b2
  pretrained: true
  num_classes: 3  # keep in sync with model.num_classes above
  dropout_rate: 0.3
  head:
    type: sequential
    layers:
      - type: adaptive_avg_pool2d
        output_size: [1, 1]
      - type: flatten
      - type: linear
        in_features: 1408
        out_features: 512
      - type: relu
      - type: dropout
        p: 0.3
      - type: linear
        in_features: 512
        out_features: 3

transfer_learning:
  freeze_backbone: false
  differential_lr:
    enabled: true
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4

input:
  size: [384, 384]

explainability:
  method: gradcam++
  target_layer: blocks.6
