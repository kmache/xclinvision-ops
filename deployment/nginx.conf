# Rate limiting zone: 10 req/s per client IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------------------------------------------------------------------------
# PHI IN TRANSIT
#
# This file terminates plain HTTP only. The platform carries PHI (patient IDs,
# clinical history, radiographs, generated reports), so a production
# deployment MUST terminate TLS — either with the server block below or at an
# upstream load balancer / service mesh.
#
# To enable here: provision a certificate (Let's Encrypt, internal CA, or your
# organisation's PKI), mount it into the nginx container, uncomment the block
# at the bottom of this file, and swap the port-80 block to the redirect shown
# in the comment on its `listen` line. Certificate provisioning is the
# operator's responsibility and is deliberately not automated here.
# ---------------------------------------------------------------------------

server {
    listen 80;
    # With TLS enabled below, replace this block's body with:
    #   return 301 https://$host$request_uri;
    server_name _;

    # Global request body size limit (matches backend MAX_UPLOAD_MB)
    client_max_body_size 20m;

    # 1. Route requests for the Dashboard (Frontend)
    location / {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Route requests for the API (Backend) with rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2b. SSE streaming chat — disable buffering so tokens arrive in real time
    location /api/v2/chat/stream {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # 3. Backend health check passthrough
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # 4. Handle Streamlit's specific WebSocket connection (required for UI to work)
    location /_stcore/stream {
        proxy_pass http://frontend:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

