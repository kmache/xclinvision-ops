# Rate limiting zone: 10 req/s per client IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name xclinvision.com;

    # Global request body size limit (matches backend MAX_UPLOAD_MB)
    client_max_body_size 20m;

    # 1. Route requests for the Dashboard (Frontend)
    location / {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Route requests for the API (Backend) with rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Handle Streamlit's specific WebSocket connection (required for UI to work)
    location /_stcore/stream {
        proxy_pass http://frontend:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}