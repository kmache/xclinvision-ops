services:
  backend:
    build: ./app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build: ./app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80" 
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy